<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MomentBox Mockups</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --p:#5B4BDB;--p2:#7A6BF0;--pc:#ECE9FF;--onpc:#2A1E8F;
  --s:#FF7A59;--sc:#FFE9E2;
  --bg:#F6F6FA;--sf:#FFFFFF;--sf2:#F0F0F6;
  --t1:#17171F;--t2:#5E5E6E;--t3:#9A9AAA;--ln:#E6E6EE;
  --ok:#1FAF6B;--err:#E5484D;--warn:#F5A524;
  --m1:#22C55E;--m2:#84CC16;--m3:#FACC15;--m4:#60A5FA;--m5:#F87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9E9F1}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;font-size:14px}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;flex:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.s14{font-size:14px!important}.s16{font-size:16px!important}.s18{font-size:18px!important}.s20{font-size:20px!important}.s22{font-size:22px!important}.s28{font-size:28px!important}.s32{font-size:32px!important}.s36{font-size:36px!important}.s40{font-size:40px!important}.s48{font-size:48px!important}

/* ---------- screen frame ---------- */
.screen{width:360px;height:780px;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;flex:none}
.screen.land{width:780px;height:360px}
.screen.dark{background:#0E0E12;color:#fff}
.sb{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;font-size:13px;font-weight:600;position:relative;z-index:30}
.sb .ic{display:flex;gap:3px;align-items:center}
.sb .ms{font-size:16px}
.sb-l .sb,.dark .sb,.sbw .sb{color:#fff}
.gb{height:20px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:30}
.gb::before{content:'';width:108px;height:4px;border-radius:2px;background:#1B1B22;opacity:.85}
.dark .gb::before,.sb-l .gb::before{background:#fff}
.content{flex:1;position:relative;overflow:hidden;min-height:0}

/* ---------- app bar ---------- */
.ab{height:56px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px 0 4px;position:relative;z-index:3}
.ab .ttl{flex:1;font-size:19px;font-weight:600;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.ab .ttl small{display:block;font-size:12px;font-weight:500;color:var(--t3);letter-spacing:0;margin-top:1px}
.ib{width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;flex:none;position:relative;color:inherit}
.ib.bgw{background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1}
.logo-t{font-size:22px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(90deg,var(--p),#B04BD6 60%,var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- bottom nav ---------- */
.bn{height:68px;flex:none;background:var(--sf);border-top:1px solid var(--ln);display:flex;align-items:center;justify-content:space-around;padding:0 4px;position:relative;z-index:4}
.bn .it{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--t2);width:64px;position:relative;font-weight:500}
.bn .it.on{color:var(--p);font-weight:600}
.bn .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;position:relative}
.bn .it.on .pill{background:var(--pc)}
.bn .pill .badge{top:-3px;right:6px;border-color:var(--sf)}
.bn .create{width:54px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--p),#B04BD6 60%,var(--s));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(91,75,219,.35)}

/* ---------- avatar ---------- */
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;font-style:normal;position:relative;letter-spacing:-.3px}
.a20{width:20px;height:20px;font-size:8.5px}.a24{width:24px;height:24px;font-size:10px}.a28{width:28px;height:28px;font-size:11px}.a32{width:32px;height:32px;font-size:12px}.a36{width:36px;height:36px;font-size:13px}.a40{width:40px;height:40px;font-size:14px}.a44{width:44px;height:44px;font-size:15px}.a48{width:48px;height:48px;font-size:16px}.a52{width:52px;height:52px;font-size:17px}.a56{width:56px;height:56px;font-size:19px}.a64{width:64px;height:64px;font-size:22px}.a88{width:88px;height:88px;font-size:30px}
.c1{background:linear-gradient(135deg,#8B7CF6,#5B4BDB)}.c2{background:linear-gradient(135deg,#FFA48A,#FF6A5B)}.c3{background:linear-gradient(135deg,#5FD8CB,#2BA59B)}.c4{background:linear-gradient(135deg,#F9C86A,#F08A24)}.c5{background:linear-gradient(135deg,#7DC8FF,#3D8BFD)}.c6{background:linear-gradient(135deg,#F7A1C4,#E05592)}.c7{background:linear-gradient(135deg,#A8DB8E,#4FA857)}.c8{background:linear-gradient(135deg,#C3AEEA,#7E57C2)}
.av .dot{position:absolute;right:0;bottom:0;width:30%;height:30%;min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.ring{padding:2.5px;border-radius:50%;background:linear-gradient(45deg,#FFB347,#FF5F6D 45%,#8B5CF6);display:inline-flex;flex:none}
.ring>.av{border:2.5px solid #fff}
.ring.seen{background:#D5D5E0}

/* ---------- buttons / chips / fields ---------- */
.btn{height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;flex:none;white-space:nowrap}
.btn.pri{background:var(--p);color:#fff;box-shadow:0 6px 14px rgba(91,75,219,.28)}
.btn.ton{background:var(--pc);color:var(--onpc)}
.btn.out{border:1.5px solid var(--ln);background:var(--sf);color:var(--t1)}
.btn.txt{color:var(--p)}
.btn.sm{height:36px;border-radius:12px;font-size:13px;padding:0 14px;box-shadow:none}
.btn.xs{height:30px;border-radius:10px;font-size:12.5px;padding:0 12px;box-shadow:none}
.chip{height:32px;border-radius:16px;padding:0 12px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;border:1px solid var(--ln);background:var(--sf);white-space:nowrap;flex:none;color:var(--t1)}
.chip.on{background:var(--pc);border-color:transparent;color:var(--onpc);font-weight:600}
.chip.dk{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.chip.dk.on{background:#fff;color:#111}
.chip.sm{height:26px;border-radius:13px;padding:0 9px;font-size:12px}
.lbl{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:7px}
.fld{height:52px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);display:flex;align-items:center;padding:0 14px;gap:10px;font-size:15px;color:var(--t1)}
.fld.focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(91,75,219,.12)}
.fld.err{border-color:var(--err);box-shadow:0 0 0 4px rgba(229,72,77,.10)}
.fld .pht{color:var(--t3)}
.hint{font-size:12px;margin-top:6px;color:var(--t3)}
.hint.err{color:var(--err);display:flex;gap:4px;align-items:center}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid #C6C6D4;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cb.on{background:var(--p);border-color:var(--p)}
.cb.on::before{content:'check';font-family:'Material Symbols Rounded';font-size:16px;color:#fff;font-weight:700}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #C6C6D4;flex:none;position:relative}
.rd.on{border-color:var(--p)}
.rd.on::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--p)}
.sw{width:44px;height:26px;border-radius:13px;background:#D5D5E0;position:relative;flex:none}
.sw::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--p)}.sw.on::before{left:21px}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;gap:3px}
.seg>div{flex:1;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--t2)}
.seg>div.on{background:var(--sf);color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(20,20,40,.12)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:4px;background:#D9D6F5;display:block}
.dots i.on{width:24px;background:var(--p)}
.dots.w i{background:rgba(255,255,255,.5);width:6px;height:6px}.dots.w i.on{background:#fff;width:6px}
.prog{height:4px;border-radius:2px;background:var(--sf2);position:relative;overflow:hidden}
.prog>i{position:absolute;left:0;top:0;bottom:0;background:var(--p);border-radius:2px;display:block}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff}
.hr{height:1px;background:var(--ln)}
.tag{color:var(--p);font-weight:500}
.mono{font-family:Consolas,'Cascadia Mono',monospace}

/* ---------- cards / lists ---------- */
.card{background:var(--sf);border-radius:18px}
.sec{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.grp{background:var(--sf);margin:0 16px;border-radius:16px}
.row{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:52px;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.row .ri{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--pc);color:var(--p);flex:none}
.row .ri .ms{font-size:20px}
.row .rt{flex:1;font-size:14px;font-weight:500;min-width:0}
.row .rs{font-size:12px;color:var(--t3);font-weight:400;margin-top:1px}
.row .rv{font-size:13px;color:var(--t2);white-space:nowrap}
.row .chev{color:var(--t3);font-size:20px}

/* ---------- feed ---------- */
.stories{display:flex;gap:12px;padding:8px 12px 12px;background:var(--sf);overflow:hidden}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--t2);width:64px;flex:none}
.post{background:var(--sf);margin-top:8px;padding:12px 0 10px}
.ph{display:flex;align-items:center;gap:10px;padding:0 8px 10px 12px}
.ph .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.ph .sub{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:4px;margin-top:1px}
.art{background-size:cover;background-position:center;position:relative;flex:none}
.acts{display:flex;align-items:center;gap:16px;padding:10px 12px 6px;font-size:13px;font-weight:600}
.acts .a{display:flex;align-items:center;gap:5px}
.cap{padding:0 12px;font-size:13.5px;line-height:1.5;color:var(--t1)}
.cap b{font-weight:600}
.cap .more{color:var(--t3)}
.pill-c{position:absolute;padding:4px 9px;border-radius:12px;background:rgba(10,10,20,.55);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px}

/* ---------- waveform ---------- */
.wave{display:flex;align-items:center;gap:2px;height:32px;flex:1;min-width:0;overflow:hidden}
.wave i{display:block;width:3px;border-radius:2px;background:#CFCBF5;flex:none}
.wave i.p{background:var(--p)}
.wave.w i{background:rgba(255,255,255,.45)}.wave.w i.p{background:#fff}
.wave.r i{background:#F6B9BB}.wave.r i.p{background:var(--err)}

/* ---------- overlays ---------- */
.scrim{position:absolute;inset:0;background:rgba(12,10,28,.48);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:26px 26px 0 0;z-index:41;padding:0 20px 20px}
.sheet .handle{width:36px;height:4px;border-radius:2px;background:#D0D0DA;margin:10px auto 14px}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--sf);border-radius:26px;z-index:41;padding:22px 20px 14px}
.bgclone{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
[data-bg]>.gb{position:absolute;left:0;right:0;bottom:0;z-index:45}

/* ---------- chat ---------- */
.msgs{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:76%;padding:9px 12px;border-radius:18px;font-size:14px;line-height:1.4;position:relative}
.bub.in{background:var(--sf);align-self:flex-start;border-bottom-left-radius:6px}
.bub.out{background:var(--p);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bub .tm{font-size:10.5px;opacity:.65;margin-left:8px;display:inline-flex;align-items:center;gap:2px;float:right;margin-top:5px}
.datesep{align-self:center;font-size:11.5px;color:var(--t3);background:var(--sf2);padding:3px 10px;border-radius:10px;margin:4px 0;font-weight:500}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--t3);font-weight:600;padding-bottom:4px}
.cal .d{height:32px;display:flex;align-items:center;justify-content:center}
.cal .d span{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;color:var(--t1)}
.cal .d.fu span{color:#C9C9D6}
.cal .d.td span{box-shadow:0 0 0 2px var(--p);font-weight:700}

/* ---------- annotation ---------- */
.ann :where([data-n]){position:relative}
.ann [data-n]{outline:1.5px dashed rgba(229,72,77,.8);outline-offset:1px}
.ann [data-n].pin{outline:none}
.ann [data-n]::after{content:attr(data-n);position:absolute;top:-12px;left:-12px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:#E5484D;color:#fff;font:700 10.5px/19px 'Be Vietnam Pro',sans-serif;text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3);z-index:90;letter-spacing:0;text-transform:none;font-variation-settings:normal;white-space:nowrap;-webkit-text-fill-color:#fff}
.ann [data-p~="r"]::after{left:auto;right:-12px}
.ann [data-p~="b"]::after{top:auto;bottom:-12px}
.ann [data-p~="i"]::after{top:4px;left:4px}
.ann [data-p~="ir"]::after{top:4px;right:4px;left:auto}

/* ---------- modes ---------- */
.pair{display:flex;gap:24px;padding:16px;background:#F1F0FA;width:max-content}
.pair.land{flex-direction:column}
.pair .pl{height:24px;font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.02em}
.pair .ann .pl{color:var(--err)}
.pair .screen{border-radius:18px;box-shadow:0 0 0 1px rgba(20,20,60,.08)}
body.single{background:transparent}
body.single .screen{display:none}
body.single .screen.target{display:flex}
.board{padding:64px;background:linear-gradient(160deg,#F1F0FA 0%,#E9ECF7 100%);min-height:100vh}
.board .bh{height:150px;display:flex;flex-direction:column;justify-content:flex-start}
.board .bh .k{font-size:15px;font-weight:600;color:var(--p);letter-spacing:.08em;text-transform:uppercase}
.board .bh h1{font-size:44px;font-weight:700;letter-spacing:-1px;margin-top:6px}
.board .bh p{font-size:17px;color:var(--t2);margin-top:8px}
.board .grid{display:grid;gap:44px;align-items:start}
.board .cell .lb{height:34px;font-size:16px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:10px}
.board .cell .lb b{font-size:13px;font-weight:700;color:#fff;background:var(--p);border-radius:8px;padding:3px 8px}
.board .dev{border-radius:30px;padding:8px;background:#16151C;box-shadow:0 20px 50px rgba(30,25,80,.22);display:inline-block}
.board .dev .screen{border-radius:22px}
</style>
</head>
<body>
